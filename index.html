<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0A0F1E"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="HealthTrack"/>
<link rel="manifest" href="./manifest.json"/>
<title>HealthTrack</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<style>
:root{
  --bg:#0A0F1E;--surface:#111827;--card:#161D2F;--border:#1E2A45;
  --accent:#00E5A0;--adim:rgba(0,229,160,0.12);
  --orange:#FF6B35;--blue:#4A9FFF;--purple:#A78BFA;
  --text:#F0F4FF;--muted:#6B7A9F;--warn:#FFB830;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  height:100%;overflow:hidden;overscroll-behavior:none;}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(76px + var(--safe-b));}
.screen::-webkit-scrollbar{display:none;}
.pad{padding:calc(48px + var(--safe-t)) 16px 0;}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;background:var(--surface);
  border-top:1px solid var(--border);display:flex;
  padding:8px 0 calc(8px + var(--safe-b));z-index:200;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;background:none;border:none;cursor:pointer;padding:4px 0;}
.nb:active{opacity:.7;}
.ni{font-size:20px;color:var(--muted);transition:color .2s;}
.nl{font-size:9px;letter-spacing:.5px;color:var(--muted);font-weight:400;}
.nb.on .ni,.nb.on .nl{color:var(--accent);}
.nb.on .nl{font-weight:700;}
.card{background:var(--card);border-radius:20px;padding:18px;
  border:1px solid var(--border);margin-bottom:14px;}
.ct{color:var(--text);font-weight:700;font-size:14px;margin-bottom:4px;}
.cs{color:var(--muted);font-size:11px;margin-bottom:14px;}
.pill{padding:7px 16px;border-radius:99px;border:none;cursor:pointer;
  white-space:nowrap;font-size:12px;font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--card);color:var(--muted);transition:all .2s;}
.pill.on{background:var(--accent);color:#0A0F1E;font-weight:700;}
.prow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;margin-bottom:16px;}
.prow::-webkit-scrollbar{display:none;}
input[type=text],input[type=number]{background:var(--card);border:1px solid var(--border);
  border-radius:12px;color:var(--text);font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;padding:12px 16px;outline:none;transition:border-color .2s;}
input:focus{border-color:var(--accent);}
input[type=number]{width:58px;text-align:center;padding:6px 8px;border-radius:8px;}
.btn{width:100%;padding:16px;border-radius:16px;border:none;
  background:linear-gradient(135deg,var(--accent),#00C98A);
  color:#0A0F1E;font-weight:800;font-size:16px;font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  cursor:pointer;box-shadow:0 8px 32px rgba(0,229,160,0.28);transition:transform .15s;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-sm{padding:10px 22px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13px;cursor:pointer;width:auto;}
.fi{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-radius:14px;margin-bottom:8px;cursor:pointer;
  background:var(--card);border:1px solid var(--border);transition:all .15s;}
.fi.on{background:var(--adim);border-color:var(--accent);}
.fi:active{transform:scale(.98);}
.tag{font-size:9px;padding:2px 7px;border-radius:99px;font-weight:700;
  letter-spacing:.5px;display:inline-block;margin-left:4px;}
.tg{background:rgba(255,184,48,.15);color:var(--warn);}
.td{background:rgba(255,107,53,.15);color:var(--orange);}
.tl{background:var(--adim);color:var(--accent);}
.gbw{margin-bottom:14px;}
.gbr{display:flex;justify-content:space-between;margin-bottom:6px;}
.gbt{height:6px;border-radius:99px;background:var(--border);overflow:hidden;}
.gbf{height:100%;border-radius:99px;transition:width 1.2s ease;}
.logbar{position:fixed;bottom:calc(76px + var(--safe-b) + 8px);
  left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;
  background:var(--surface);border:1px solid var(--accent);border-radius:16px;
  padding:13px 16px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 8px 32px rgba(0,229,160,0.18);z-index:150;}
.mfr{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--border);}
.mfi{background:var(--card);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;font-weight:700;
  padding:8px 12px;outline:none;width:110px;text-align:right;}
.mfi:focus{border-color:var(--accent);}
.ms{flex:1;text-align:center;}
.msb{padding:7px 4px;border-radius:8px;border:1px solid var(--border);background:var(--surface);}
.msb.hit{background:var(--adim);border-color:var(--accent);}
.msv{font-size:12px;font-weight:700;color:var(--muted);}
.msb.hit .msv{color:var(--accent);}
.msy{font-size:9px;color:var(--muted);margin-top:3px;}
.loader{display:flex;justify-content:center;align-items:center;padding:60px 0;gap:8px;}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:bounce 1.4s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.16s;}.dot:nth-child(3){animation-delay:.32s;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .35s ease forwards;}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease forwards;}
.setup{background:linear-gradient(135deg,#1A2240,var(--card));
  border:1px solid var(--warn);border-radius:16px;padding:16px;
  margin-bottom:16px;color:var(--warn);font-size:13px;line-height:1.7;}
.setup code{background:var(--surface);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <div class="screen" id="scr"></div>
  <nav>
    <button class="nb on" data-s="home" onclick="go('home')"><span class="ni">⊡</span><span class="nl">Home</span></button>
    <button class="nb" data-s="log" onclick="go('log')"><span class="ni">✚</span><span class="nl">Log</span></button>
    <button class="nb" data-s="trends" onclick="go('trends')"><span class="ni">↗</span><span class="nl">Trends</span></button>
    <button class="nb" data-s="foods" onclick="go('foods')"><span class="ni">◎</span><span class="nl">Foods</span></button>
    <button class="nb" data-s="metrics" onclick="go('metrics')"><span class="ni">♡</span><span class="nl">Metrics</span></button>
  </nav>
</div>
<script>
let API = localStorage.getItem('ht_api_url') || '';
// ---

const FOOD_DB_LOCAL=[
  {category:"Breakfast",name:"Idli",portion:"1 small",cal:60,protein:2,glycemic:"",remark:""},
  {category:"Breakfast",name:"Dosa",portion:"1 medium",cal:150,protein:3,glycemic:"",remark:""},
  {category:"Breakfast",name:"Masala Dosa",portion:"1",cal:450,protein:5,glycemic:"",remark:"Glycemic"},
  {category:"Breakfast",name:"Upma",portion:"200g",cal:350,protein:5,glycemic:"",remark:"Glycemic"},
  {category:"Lunch",name:"Chapathi",portion:"1 medium",cal:110,protein:3,glycemic:"Low",remark:""},
  {category:"Lunch",name:"Dal khichdi",portion:"1 bowl",cal:220,protein:8,glycemic:"Low",remark:""},
  {category:"Lunch",name:"Chicken biryani",portion:"1 small bowl",cal:300,protein:12,glycemic:"",remark:""},
  {category:"Lunch",name:"Sambar",portion:"1 bowl",cal:80,protein:4,glycemic:"Low",remark:""},
  {category:"Lunch",name:"Lacha paratha",portion:"1 medium",cal:250,protein:5,glycemic:"",remark:""},
  {category:"Lunch",name:"Boiled Chana",portion:"100g",cal:180,protein:8,glycemic:"Low",remark:""},
  {category:"Dinner",name:"Chicken salad",portion:"200g",cal:250,protein:30,glycemic:"Low",remark:""},
  {category:"Dinner",name:"Tuna Fish Salad",portion:"250g",cal:350,protein:30,glycemic:"",remark:""},
  {category:"Dinner",name:"Moong dal",portion:"1 bowl",cal:140,protein:8,glycemic:"Low",remark:""},
  {category:"Dinner",name:"Tomato curry",portion:"1 bowl",cal:70,protein:2,glycemic:"Low",remark:""},
  {category:"Dinner",name:"Ragi Roti",portion:"1 medium",cal:140,protein:3,glycemic:"Low",remark:""},
  {category:"Dinner",name:"Soya Paneer with ghee",portion:"100g",cal:133,protein:15.5,glycemic:"Low",remark:""},
  {category:"Dinner",name:"Baked Fish",portion:"100g",cal:200,protein:25,glycemic:"Low",remark:""},
  {category:"Snack",name:"Boiled Egg White",portion:"1",cal:17,protein:3.5,glycemic:"",remark:""},
  {category:"Snack",name:"Omlette",portion:"1 egg",cal:100,protein:6,glycemic:"",remark:""},
  {category:"Snack",name:"Omelette (2 eggs)",portion:"1 serving",cal:190,protein:13,glycemic:"Low",remark:""},
  {category:"Snack",name:"Chicken kebab",portion:"100g",cal:200,protein:25,glycemic:"Low",remark:""},
  {category:"Snack",name:"Peanut",portion:"1 cup",cal:180,protein:7,glycemic:"",remark:"Dense Calorie"},
  {category:"Snack",name:"Roasted chana",portion:"50g",cal:180,protein:10,glycemic:"Low",remark:""},
  {category:"Snack",name:"Apple",portion:"1 small",cal:80,protein:0.5,glycemic:"Low",remark:""},
  {category:"Snack",name:"Papaya",portion:"1 bowl",cal:60,protein:1,glycemic:"Low",remark:""},
  {category:"Snack",name:"Buttermilk",portion:"1 glass",cal:50,protein:3,glycemic:"Low",remark:""},
  {category:"Snack",name:"Lemon tea",portion:"1 cup",cal:5,protein:0,glycemic:"Low",remark:""},
  {category:"Snack",name:"Tea wos",portion:"1 cup",cal:80,protein:0,glycemic:"",remark:""},
  {category:"Snack",name:"Coffee wos",portion:"1 cup",cal:60,protein:0,glycemic:"",remark:""},
  {category:"Snack",name:"Dates",portion:"50g",cal:140,protein:1,glycemic:"",remark:""},
  {category:"Snack",name:"Curd",portion:"100g",cal:70,protein:3,glycemic:"",remark:""},
  {category:"Snack",name:"Mosambi",portion:"100ml",cal:180,protein:0,glycemic:"",remark:"Glycemic"},
  {category:"Snack",name:"Digestive Biscuit",portion:"1",cal:85,protein:3,glycemic:"",remark:"Glycemic"},
  {category:"Snack",name:"Black Coffee",portion:"1 cup",cal:5,protein:0,glycemic:"Low",remark:""},
];

let S={
  screen:"home",dash:null,foods:null,today:null,
  log:{meal:"Breakfast",items:[],search:""},
  logDone:false,logResult:null,
  foodFilter:"All",
  metrics:{weight:"",hba1c:"",ldl:"",trig:""},
  metricsDone:false,
  charts:{},
};

const isSetup=()=>!API||API==='';
const fmt=n=>Math.round(n).toLocaleString();
const greet=()=>{const h=new Date().getHours();return h<12?"Good Morning":h<17?"Good Afternoon":"Good Evening";};
const dayStr=()=>new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const todayKey=()=>new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"});
const dayName=()=>new Date().toLocaleDateString("en-GB",{weekday:"long"});
const ld=()=>`<div class="loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;

async function api(action,body){
  if(isSetup()) return null;
  const url=`${API}?action=${action}`;
  const r=await fetch(url,body?{method:"POST",body:JSON.stringify(body)}:{method:"GET"});
  return r.json();
}

function mockDash(){
  return{
    actuals:[
      {date:"20/04/2026",kcalIn:1610,protein:42},{date:"21/04/2026",kcalIn:2065,protein:42},
      {date:"22/04/2026",kcalIn:1960,protein:52},{date:"23/04/2026",kcalIn:920,protein:26.5},
      {date:"24/04/2026",kcalIn:1658.5,protein:65.5},{date:"25/04/2026",kcalIn:1734.5,protein:79},
      {date:"26/04/2026",kcalIn:1296.5,protein:73},{date:"27/04/2026",kcalIn:1538,protein:35.5},
      {date:"28/04/2026",kcalIn:1590,protein:46},{date:"29/04/2026",kcalIn:1513,protein:61.5},
      {date:"30/04/2026",kcalIn:1860,protein:76},{date:"01/05/2026",kcalIn:1438,protein:72},
      {date:"02/05/2026",kcalIn:1293,protein:56},
    ],
    goals:[
      {year:"Dec'26",weight:90,hba1c:6.5,ldl:150,trig:175},
      {year:"Dec'27",weight:85,hba1c:6.0,ldl:125,trig:150},
      {year:"Dec'28",weight:80,hba1c:5.5,ldl:100,trig:125},
      {year:"Dec'29",weight:75,hba1c:5.0,ldl:80,trig:90},
    ],
    current:{weight:95.3,hba1c:7.0,ldl:186,trig:220}
  };
}

async function loadDash(){
  if(S.dash) return;
  if(isSetup()){S.dash=mockDash();return;}
  const d=await api("dashboard");
  S.dash=(d&&!d.error)?d:mockDash();
}
async function loadFoods(){
  if(S.foods) return;
  if(isSetup()){S.foods={foods:FOOD_DB_LOCAL};return;}
  const d=await api("foods");
  S.foods=(d&&!d.error)?d:{foods:FOOD_DB_LOCAL};
}
async function loadToday(){
  if(S.today) return;
  if(isSetup()){S.today={meals:[],dailyKcal:0,dailyProt:0};return;}
  const d=await api("today");
  S.today=(d&&!d.error)?d:{meals:[],dailyKcal:0,dailyProt:0};
}

function tagH(food){
  let h="";
  const r=(food.remark||"").toLowerCase();
  if(r.includes("glycemic"))h+=`<span class="tag tg">⚡ Glycemic</span>`;
  if(r.includes("dense"))h+=`<span class="tag td">🔥 Dense</span>`;
  if((food.glycemic||"").toLowerCase()==="low")h+=`<span class="tag tl">✓ Low GI</span>`;
  return h;
}

function ring(val,max,color,label,unit,sz=88){
  const r=(sz-12)/2,c=2*Math.PI*r,f=Math.min(1,val/max)*c;
  return`<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <div style="position:relative;width:${sz}px;height:${sz}px">
      <svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)">
        <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="10"/>
        <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${color}" stroke-width="10"
          stroke-dasharray="${f} ${c}" stroke-linecap="round" style="transition:stroke-dasharray 1.2s ease"/>
      </svg>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center">
        <div style="font-size:17px;font-weight:800;color:${color}">${fmt(val)}</div>
        <div style="font-size:9px;color:var(--muted);letter-spacing:1px">${unit}</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted)">${label}</div>
  </div>`;
}

function goalBar(label,cur,goal,unit){
  const good=cur<=goal;
  const w=Math.min(100,(cur/(goal*1.4))*100);
  const gr=good?"linear-gradient(90deg,var(--accent),#00FF99)":"linear-gradient(90deg,var(--warn),var(--orange))";
  return`<div class="gbw">
    <div class="gbr">
      <span style="color:var(--muted);font-size:12px">${label}</span>
      <span style="color:${good?'var(--accent)':'var(--warn)'};font-size:12px;font-weight:600">${cur} → ${goal} ${unit}</span>
    </div>
    <div class="gbt"><div class="gbf" style="width:${w}%;background:${gr}"></div></div>
  </div>`;
}

function killCharts(){Object.values(S.charts).forEach(c=>{try{c.destroy()}catch(e){}});S.charts={};}

async function go(screen){
  S.screen=screen;
  document.querySelectorAll(".nb").forEach(b=>b.classList.toggle("on",b.dataset.s===screen));
  killCharts();
  const el=document.getElementById("scr");
  el.innerHTML=ld(); el.scrollTop=0;
  if(screen==="home"){await Promise.all([loadDash(),loadToday()]);el.innerHTML=renderHome();requestAnimationFrame(buildSparkline);}
  else if(screen==="log"){await loadFoods();el.innerHTML=renderLog();}
  else if(screen==="trends"){await loadDash();el.innerHTML=renderTrends();requestAnimationFrame(()=>{buildCalChart();buildProtChart();buildBarChart();});}
  else if(screen==="foods"){await loadFoods();el.innerHTML=renderFoods();}
  else if(screen==="metrics"){el.innerHTML=renderMetrics();}
}

// ── Screens ───────────────────────────────────────────────────
function renderHome(){
  const d=S.dash,t=S.today;
  const cur=d?.current||{weight:95.3,hba1c:7,ldl:186,trig:220};
  const g0=(d?.goals||[])[0]||{year:"Dec'26",weight:90,hba1c:6.5,ldl:150,trig:175};
  const kcal=t?.dailyKcal||0,prot=t?.dailyProt||0,budget=Math.max(0,1600-kcal);
  const actuals=(d?.actuals||[]).filter(a=>a.kcalIn>0);
  const avg=actuals.length?Math.round(actuals.reduce((s,a)=>s+a.kcalIn,0)/actuals.length):0;
  return`<div class="pad">
  ${isSetup() ? '<div class="setup fu">&#9881;&#65039; <strong>Sample data</strong> &mdash; Drive not connected. <span onclick="showSetupPopup()" style="color:#00E5A0;text-decoration:underline;cursor:pointer">Connect now</span></div>' : '<div style="background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#00E5A0;display:flex;justify-content:space-between;align-items:center"><span>&#10003; Connected to Drive</span><span onclick="resetApiUrl()" style="color:#6B7A9F;cursor:pointer;font-size:11px">Change URL</span></div>'}
  <div style="padding-bottom:20px" class="fu">
    <div style="color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase">${dayStr()}</div>
    <div style="font-size:26px;font-weight:800;margin-top:4px">${greet()} 👋</div>
  </div>
  <div class="card fu" style="background:linear-gradient(135deg,var(--card),#1A2240);box-shadow:0 0 40px rgba(0,229,160,0.07)">
    <div style="color:var(--muted);font-size:10px;letter-spacing:2px;margin-bottom:16px">TODAY'S INTAKE</div>
    <div style="display:flex;justify-content:space-around">
      ${ring(kcal,1600,kcal>1800?'var(--orange)':'var(--accent)',"kcal","CALORIES")}
      ${ring(prot,80,"var(--blue)","protein","GRAMS")}
      ${ring(budget,1600,"var(--purple)","budget","LEFT")}
    </div>
    ${t?.meals?.length?`<div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px">
      ${t.meals.map(m=>`<div style="display:flex;justify-content:space-between;padding:4px 0">
        <span style="color:var(--muted);font-size:12px">${m.mealType}</span>
        <span style="color:var(--text);font-size:12px">${fmt(m.mealCal)} kcal · ${m.mealProt}g protein</span>
      </div>`).join("")}</div>`:""}
  </div>
  <button class="btn fu" onclick="go('log')" style="margin-bottom:14px">✚  Log a Meal</button>
  <div class="card fu">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <span class="ct">Calorie Trend</span>
      <span style="color:var(--muted);font-size:12px">avg ${fmt(avg)} kcal</span>
    </div>
    <div class="cs">1,600 kcal daily target</div>
    <div style="height:120px"><canvas id="sparkChart"></canvas></div>
  </div>
  <div class="card fu">
    <div class="ct" style="margin-bottom:16px">Goals — ${g0.year}</div>
    ${goalBar("Weight",cur.weight,g0.weight,"kg")}
    ${goalBar("HbA1c",cur.hba1c,g0.hba1c,"%")}
    ${goalBar("LDL",cur.ldl,g0.ldl,"mg/dL")}
    ${goalBar("Triglycerides",cur.trig,g0.trig,"mg/dL")}
  </div>
  </div>`;
}

function renderLog(){
  if(S.logDone) return renderLogDone();
  const{meal,items,search}=S.log;
  const foods=S.foods?.foods||FOOD_DB_LOCAL;
  const shown=search?foods.filter(f=>f.name.toLowerCase().includes(search.toLowerCase())).slice(0,16)
    :foods.filter(f=>f.category===meal).slice(0,16);
  const totCal=items.reduce((s,i)=>s+i.cal*i.qty,0);
  const totPro=items.reduce((s,i)=>s+i.protein*i.qty,0);
  return`<div class="pad">
  <div style="font-size:22px;font-weight:800;margin-bottom:20px">Log Meal</div>
  <div class="prow">${["Breakfast","Lunch","Dinner","Snack"].map(m=>
    `<button class="pill${meal===m?' on':''}" onclick="setMeal('${m}')">${m}</button>`).join("")}</div>
  <input type="text" placeholder="🔍 Search food..." value="${search}"
    oninput="S.log.search=this.value;reLog()" style="width:100%;margin-bottom:14px"/>
  <div>${shown.map(food=>{
    const sel=items.find(i=>i.name===food.name);
    return`<div class="fi${sel?' on':''}" onclick="toggleFood('${food.name.replace(/'/g,"\\'")}')">
      <div style="flex:1">
        <div style="display:flex;align-items:center;flex-wrap:wrap;margin-bottom:3px">
          <span style="font-size:14px;font-weight:${sel?700:400}">${food.name}</span>${tagH(food)}
        </div>
        <span style="color:var(--muted);font-size:11px">${food.cal} kcal · ${food.protein}g protein · ${food.portion||food.category}</span>
      </div>
      ${sel?`<input type="number" min=".5" step=".5" value="${sel.qty}"
          onclick="event.stopPropagation()" onchange="setQty('${food.name.replace(/'/g,"\\'")}',this.value)"/>`
        :`<span style="color:var(--muted);font-size:22px">+</span>`}
    </div>`;}).join("")}
    ${!shown.length?`<div style="color:var(--muted);text-align:center;padding:24px">No results</div>`:''}
    ${!items.length?`<div style="color:var(--muted);text-align:center;padding:24px;font-size:13px">Tap items to add them</div>`:''}
  </div></div>
  ${items.length?`<div class="logbar">
    <div>
      <div style="color:var(--accent);font-weight:800;font-size:18px">${fmt(totCal)} kcal · ${Math.round(totPro)}g</div>
      <div style="color:var(--muted);font-size:11px">${items.length} item${items.length>1?'s':''}</div>
    </div>
    <button onclick="submitLog()" style="background:var(--accent);border:none;border-radius:12px;
      padding:11px 22px;color:#0A0F1E;font-weight:800;font-size:14px;cursor:pointer;font-family:'Sora',sans-serif">
      Save →</button>
  </div>`:""}`;
}

function renderLogDone(){
  const r=S.logResult;
  return`<div style="padding:calc(60px + var(--safe-t)) 16px;display:flex;flex-direction:column;align-items:center;gap:20px">
    <div class="pop" style="font-size:72px">✅</div>
    <div style="color:var(--accent);font-weight:800;font-size:24px;text-align:center">${r.mealType} Logged!</div>
    <div style="display:flex;gap:12px">
      <div style="text-align:center;background:var(--adim);border-radius:14px;padding:14px 22px">
        <div style="color:var(--accent);font-weight:800;font-size:24px">${fmt(r.totalCal)}</div>
        <div style="color:var(--muted);font-size:11px">kcal</div>
      </div>
      <div style="text-align:center;background:rgba(74,159,255,.12);border-radius:14px;padding:14px 22px">
        <div style="color:var(--blue);font-weight:800;font-size:24px">${Math.round(r.totalProtein)}g</div>
        <div style="color:var(--muted);font-size:11px">protein</div>
      </div>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;font-size:13px;line-height:1.7;width:100%">
      <div style="color:var(--muted);font-size:10px;letter-spacing:1px;margin-bottom:6px">DAY TOTAL</div>
      🔥 <strong style="color:var(--accent)">${fmt(r.dayKcal)}</strong> kcal
      &nbsp;·&nbsp; 💪 <strong style="color:var(--blue)">${r.dayProt}g</strong> protein<br>
      ${r.dayKcal>1600
        ?`<span style="color:var(--warn);font-size:12px">⚠️ Over target by ${fmt(r.dayKcal-1600)} kcal</span>`
        :`<span style="color:var(--accent);font-size:12px">✓ ${fmt(1600-r.dayKcal)} kcal remaining</span>`}
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-sm" onclick="resetLog()">Log Another</button>
      <button class="btn-sm" onclick="go('home')">← Home</button>
    </div>
  </div>`;
}

function renderTrends(){
  const d=S.dash;
  const cur=d?.current||{weight:95.3,hba1c:7,ldl:186,trig:220};
  const goals=d?.goals||[];
  const ms=[
    {label:"Weight (kg)",current:cur.weight,goals:goals.map(g=>g.weight),years:goals.map(g=>g.year)},
    {label:"HbA1c (%)",current:cur.hba1c,goals:goals.map(g=>g.hba1c),years:goals.map(g=>g.year)},
    {label:"LDL",current:cur.ldl,goals:goals.map(g=>g.ldl),years:goals.map(g=>g.year)},
    {label:"Triglycerides",current:cur.trig,goals:goals.map(g=>g.trig),years:goals.map(g=>g.year)},
  ];
  return`<div class="pad">
  <div style="font-size:22px;font-weight:800;margin-bottom:20px">Trends</div>
  <div class="card"><div class="ct">Calorie Intake</div><div class="cs">Target: 1,400–1,600 kcal/day</div>
    <div style="height:170px"><canvas id="calChart"></canvas></div></div>
  <div class="card"><div class="ct">Protein Intake</div><div class="cs">Target: 60–80g/day</div>
    <div style="height:150px"><canvas id="protChart"></canvas></div></div>
  <div class="card"><div class="ct">Daily Comparison</div><div class="cs">Calories vs Protein</div>
    <div style="height:150px"><canvas id="barChart"></canvas></div></div>
  <div class="card">
    <div class="ct" style="margin-bottom:16px">Long-term Milestones</div>
    ${ms.map(m=>`<div style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="color:var(--text);font-size:13px">${m.label}</span>
        <span style="color:var(--warn);font-size:13px;font-weight:700">Now: ${m.current}</span>
      </div>
      <div style="display:flex;gap:6px">
        ${(m.goals||[]).map((g,i)=>`<div class="ms">
          <div class="msb${m.current<=g?' hit':''}"><div class="msv">${g}</div></div>
          <div class="msy">${(m.years||[])[i]||""}</div>
        </div>`).join("")}
      </div>
    </div>`).join("")}
  </div></div>`;
}

function renderFoods(){
  const cats=["All","Breakfast","Lunch","Dinner","Snack"];
  const foods=S.foods?.foods||FOOD_DB_LOCAL;
  const shown=S.foodFilter==="All"?foods:foods.filter(f=>f.category===S.foodFilter);
  return`<div class="pad">
  <div style="font-size:22px;font-weight:800;margin-bottom:4px">Food Database</div>
  <div style="color:var(--muted);font-size:12px;margin-bottom:16px">${foods.length} items from your Drive</div>
  <div class="prow">${cats.map(c=>`<button class="pill${S.foodFilter===c?' on':''}" onclick="setFF('${c}')">${c}</button>`).join("")}</div>
  ${shown.map(f=>`<div class="fi" style="cursor:default">
    <div style="flex:1">
      <div style="display:flex;align-items:center;flex-wrap:wrap;margin-bottom:4px">
        <span style="font-size:14px">${f.name}</span>${tagH(f)}
      </div>
      <span style="color:var(--muted);font-size:11px">${f.portion||f.category}</span>
    </div>
    <div style="text-align:right;min-width:54px">
      <div style="color:var(--accent);font-weight:700;font-size:15px">${f.cal}</div>
      <div style="color:var(--blue);font-size:11px">${f.protein}g P</div>
    </div>
  </div>`).join("")}
  </div>`;
}

function renderMetrics(){
  if(S.metricsDone) return`<div style="padding:calc(80px + var(--safe-t)) 16px;display:flex;flex-direction:column;align-items:center;gap:20px">
    <div class="pop" style="font-size:64px">📊</div>
    <div style="color:var(--accent);font-weight:800;font-size:22px">Metrics Saved!</div>
    <div style="color:var(--muted);font-size:14px;text-align:center">Updated in your Drive dashboard</div>
    <div style="display:flex;gap:10px">
      <button class="btn-sm" onclick="S.metricsDone=false;S.metrics={weight:'',hba1c:'',ldl:'',trig:''};go('metrics')">Log Again</button>
      <button class="btn-sm" onclick="go('home')">← Home</button>
    </div>
  </div>`;
  return`<div class="pad">
  <div style="font-size:22px;font-weight:800;margin-bottom:6px">Health Metrics</div>
  <div style="color:var(--muted);font-size:12px;margin-bottom:24px">Leave blank to skip · Writes to Drive Dashboard sheet</div>
  <div class="card">
    ${[
      {key:"weight",label:"Weight",sub:"Goal: 90 kg by Dec '26",ph:"95.3",unit:"kg",step:"0.1"},
      {key:"hba1c",label:"HbA1c",sub:"Goal: 6.5% by Dec '26",ph:"7.0",unit:"%",step:"0.1"},
      {key:"ldl",label:"LDL",sub:"Goal: 150 mg/dL by Dec '26",ph:"186",unit:"mg/dL",step:"1"},
      {key:"trig",label:"Triglycerides",sub:"Goal: 175 mg/dL by Dec '26",ph:"220",unit:"mg/dL",step:"1"},
    ].map((f,i)=>`<div class="mfr" style="${i===3?'border-bottom:none':''}">
      <div>
        <div style="color:var(--text);font-size:14px;font-weight:600">${f.label}</div>

      </div>
      <div style="display:flex;align-items:center;gap:8px">

        <span style="color:var(--muted);font-size:12px">${f.unit}</span>

  </div>

// ── Actions ───────────────────────────────────────────────────
function setMeal(m){S.log.meal=m;S.log.search="";reLog();}
function setFF(f){S.foodFilter=f;document.getElementById("scr").innerHTML=renderFoods();}
function reLog(){document.getElementById("scr").innerHTML=renderLog();}

function toggleFood(name){
  const foods=S.foods?.foods||FOOD_DB_LOCAL;
  const food=foods.find(f=>f.name===name);
  const idx=S.log.items.findIndex(i=>i.name===name);
  if(idx>=0)S.log.items.splice(idx,1);
  else S.log.items.push({...food,qty:1});
  reLog();
}
function setQty(name,val){const i=S.log.items.find(i=>i.name===name);if(i)i.qty=parseFloat(val)||1;}

async function submitLog(){
  const{meal,items}=S.log;
  if(!items.length) return;
  const totalCal=Math.round(items.reduce((s,i)=>s+i.cal*i.qty,0));
  const totalProtein=Math.round(items.reduce((s,i)=>s+i.protein*i.qty,0));
  document.getElementById("scr").innerHTML=`<div style="padding:calc(100px + var(--safe-t)) 16px;text-align:center">
    ${ld()}<div style="color:var(--accent);font-size:16px;font-weight:700;margin-top:16px">Writing to Drive…</div>
    <div style="color:var(--muted);font-size:13px;margin-top:6px">Updating Plan&amp;Rec + Dashboard</div></div>`;
  let result;
  if(isSetup()){
    result={mealType:meal,totalCal,totalProtein,dayKcal:totalCal,dayProt:totalProtein};
  } else {
    try{result=await api("logMeal",{date:todayKey(),dayName:dayName(),mealType:meal,
      items:items.map(i=>({food:i.name,qty:i.qty,cal:i.cal,protein:i.protein})),totalCal,totalProtein});}
    catch(e){result={mealType:meal,totalCal,totalProtein,dayKcal:totalCal,dayProt:totalProtein};}
  }
  S.logResult=result; S.logDone=true; S.today=null;
  document.getElementById("scr").innerHTML=renderLogDone();
}

function resetLog(){S.log={meal:"Breakfast",items:[],search:""};S.logDone=false;S.logResult=null;reLog();}

async function submitMetrics(){
  const{weight,hba1c,ldl,trig}=S.metrics;
  if(!weight&&!hba1c&&!ldl&&!trig) return;
  document.getElementById("scr").innerHTML=`<div style="padding:calc(100px + var(--safe-t)) 16px;text-align:center">
    ${ld()}<div style="color:var(--accent);font-size:16px;font-weight:700;margin-top:16px">Updating Drive…</div></div>`;
  if(!isSetup()){
    try{await api("logMetrics",{date:todayKey(),
      weight:weight?parseFloat(weight):null,hba1c:hba1c?parseFloat(hba1c):null,
      ldl:ldl?parseFloat(ldl):null,trig:trig?parseFloat(trig):null});}catch(e){}
  }
  S.metricsDone=true; S.dash=null;
  document.getElementById("scr").innerHTML=renderMetrics();
}

// ── Charts ─────────────────────────────────────────────────────
const CG="#1E2A45",CT="#6B7A9F";
const cOpts={responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:false}},
  scales:{x:{grid:{color:CG},ticks:{color:CT,font:{size:9},maxRotation:0}},
          y:{grid:{color:CG},ticks:{color:CT,font:{size:9}}}}};

function getActuals(){return(S.dash?.actuals||[]).filter(a=>a.kcalIn>0);}

function buildSparkline(){
  const ctx=document.getElementById("sparkChart");if(!ctx)return;
  const a=getActuals();
  S.charts.spark=new Chart(ctx,{type:"line",data:{
    labels:a.map(d=>d.date.slice(0,5)),
    datasets:[{data:a.map(d=>d.kcalIn),borderColor:"#00E5A0",
      backgroundColor:"rgba(0,229,160,0.07)",borderWidth:2,pointRadius:0,fill:true,tension:0.4}]
  },options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{enabled:false}},
    scales:{x:{display:false},y:{display:false}}}});
}
function buildCalChart(){
  const ctx=document.getElementById("calChart");if(!ctx)return;
  const a=getActuals();
  S.charts.cal=new Chart(ctx,{type:"line",data:{
    labels:a.map(d=>d.date.slice(0,5)),
    datasets:[{label:"kcal",data:a.map(d=>d.kcalIn),borderColor:"#00E5A0",
      backgroundColor:"rgba(0,229,160,0.08)",borderWidth:2.5,
      pointRadius:3,pointBackgroundColor:"#00E5A0",fill:true,tension:0.4}]
  },options:{...cOpts}});
}
function buildProtChart(){
  const ctx=document.getElementById("protChart");if(!ctx)return;
  const a=getActuals();
  S.charts.prot=new Chart(ctx,{type:"line",data:{
    labels:a.map(d=>d.date.slice(0,5)),
    datasets:[{label:"protein (g)",data:a.map(d=>d.protein),borderColor:"#4A9FFF",
      backgroundColor:"rgba(74,159,255,0.08)",borderWidth:2.5,
      pointRadius:3,pointBackgroundColor:"#4A9FFF",fill:true,tension:0.4}]
  },options:{...cOpts}});
}
function buildBarChart(){
  const ctx=document.getElementById("barChart");if(!ctx)return;
  const a=getActuals();
  S.charts.bar=new Chart(ctx,{type:"bar",data:{
    labels:a.map(d=>d.date.slice(0,5)),
    datasets:[
      {label:"kcal",data:a.map(d=>d.kcalIn),backgroundColor:"rgba(0,229,160,0.7)",borderRadius:4},
      {label:"protein (g)",data:a.map(d=>d.protein),backgroundColor:"rgba(74,159,255,0.7)",borderRadius:4},
    ]
  },options:{...cOpts,plugins:{legend:{labels:{color:CT,font:{size:10}}}}}});
}

(function(){
  var l=document.createElement('link');
  l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap';

})();

(function(){
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';

if("serviceWorker" in navigator)

</script>

<!-- Setup Popup -->
<div id="setup-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);
  z-index:999;display:none;align-items:center;justify-content:center;padding:24px;">
  <div style="background:#161D2F;border:1px solid #1E2A45;border-radius:24px;
    padding:28px 24px;width:100%;max-width:390px;box-shadow:0 24px 64px rgba(0,0,0,0.6)">
    <div style="font-size:36px;text-align:center;margin-bottom:16px">⚙️</div>
    <div style="font-size:20px;font-weight:800;color:#F0F4FF;text-align:center;margin-bottom:8px">
      Connect Your Drive</div>
    <div style="font-size:13px;color:#6B7A9F;text-align:center;line-height:1.6;margin-bottom:24px">
      Paste your Google Apps Script Web App URL below.<br/>
      <span style="color:#00E5A0">script.google.com</span> &rarr; Deploy &rarr; Web App &rarr; Copy URL
    </div>
    <input id="api-url-input" type="url"
      placeholder="https://script.google.com/macros/s/..."
      style="width:100%;padding:14px 16px;border-radius:14px;border:1px solid #1E2A45;
        background:#111827;color:#F0F4FF;font-size:13px;font-family:inherit;
        outline:none;margin-bottom:8px;transition:border-color .2s"
      onfocus="this.style.borderColor='#00E5A0'"
      onblur="this.style.borderColor='#1E2A45'"
      onkeydown="if(event.key==='Enter')saveApiUrl()"/>
    <div id="url-error" style="color:#FF4757;font-size:12px;margin-bottom:12px;display:none">
      Please enter a valid Apps Script URL</div>
    <button onclick="saveApiUrl()" style="width:100%;padding:15px;border-radius:14px;border:none;
      background:linear-gradient(135deg,#00E5A0,#00C98A);color:#0A0F1E;font-weight:800;
      font-size:15px;cursor:pointer;font-family:inherit;
      box-shadow:0 8px 24px rgba(0,229,160,0.3);margin-bottom:12px">
      Connect &rarr;
    </button>
    <button onclick="skipSetup()" style="width:100%;padding:12px;border-radius:14px;border:none;
      background:transparent;color:#6B7A9F;font-size:13px;cursor:pointer;font-family:inherit">
      Skip &mdash; use sample data
    </button>
  </div>
</div>

<script>
function showSetupPopup(){
  var el=document.getElementById('setup-overlay');
  el.style.display='flex';
  setTimeout(function(){ document.getElementById('api-url-input').focus(); }, 100);
}

function saveApiUrl(){
  var val = document.getElementById('api-url-input').value.trim();
  var err = document.getElementById('url-error');
  if(!val || !val.startsWith('https://script.google.com')){
    err.style.display='block';
    return;
  }
  err.style.display='none';
  API = val;
  localStorage.setItem('ht_api_url', val);
  document.getElementById('setup-overlay').style.display='none';
  go('home');
}

function skipSetup(){
  document.getElementById('setup-overlay').style.display='none';
  go('home');
}

function resetApiUrl(){
  localStorage.removeItem('ht_api_url');
  API='';
  showSetupPopup();
}
</script>
